[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# A virtual display for Chromium to draw into. 1600x1000 leaves room around the
# 1440x900 browser viewport so the window is not clipped in the noVNC view.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Exposes that display over VNC on loopback only, password protected. Even
# inside the container we do not want this reachable from anywhere else.
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbauth /state/vncpasswd -rfbport 5900 -localhost -quiet
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Browser-friendly wrapper around that VNC port, so logging in needs no client.
[program:novnc]
command=/usr/bin/websockify --web=/tmp/novnc-web 6080 127.0.0.1:5900
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=/usr/local/bin/python -m app.main
directory=/app
autorestart=true
# Never give up on the app: a FATAL state here means a container that looks
# up but has no dashboard, which is the worst way to fail.
startretries=1000000
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
