<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkediNPD</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12151a;
         color: #e8eaed; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
  .box { text-align: center; max-width: 420px; padding: 24px; }
  .box img { width: 160px; height: 160px; display: block; margin: 0 auto 18px; }
  h1 { font-size: 34px; letter-spacing: -.5px; margin: 0 0 24px; }
  a { display: block; text-decoration: none; font-weight: 600; padding: 13px;
      border-radius: 9px; margin-top: 10px; font-size: 15px; }
  .primary { background: #0a66c2; color: #fff; }
  .secondary { background: #232a34; color: #e8eaed; border: 1px solid #2a313c; }
  p { color: #97a0ad; font-size: 13px; margin: 18px 0 0; }
</style>
</head>
<body>
<div class="box">
  <img src="/icon.svg" alt="">
  <h1>LinkediNPD</h1>
  <a class="primary" href="__DASHBOARD_URL__" target="_blank" rel="noopener">Open the dashboard</a>
  <a class="secondary" href="__NOVNC_URL__">LinkedIn login window</a>
  <p>The login window is the container's own browser. Sign in there once; the session is kept.</p>
</div>
</body>
</html>
